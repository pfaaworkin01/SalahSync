name: Deploy Live Web Demo & Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Build Flutter Web
        run: flutter build web --release --base-href "/SalahSync/"

      - name: 📱 Build Android APK
        run: flutter build apk --release

      - name: 📋 Copy APK to Web directory for Direct Web Link
        run: cp build/app/outputs/flutter-apk/app-release.apk build/web/SalahSync-release.apk

      - name: 🎨 Prepare Landing Page & Flutter Web App
        run: |
          cp build/web/index.html build/web/app.html
          cp web/landing.html build/web/index.html


      - name: 📤 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: salahsync-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      - name: 🏷️ Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "SalahSync v1.0.0 Release"
          body: |
            ## 📱 SalahSync v1.0.0 Official Release
            
            ### ✨ Features
            - **Automatic Prayer Muting**: Auto-silences your phone during Fajr, Dhuhr, Asr, Maghrib, Isha & Jumu'ah.
            - **Pre-Mute Buffer**: Customizable pre-mute buffer (e.g. 5–10 mins) before prayer starts.
            - **Do Not Disturb & Vibrate Modes**: Full support for Android Do Not Disturb policy and Vibrate profiles.
            - **Manual Override Picker**: Quick duration slider (up to 300 mins) and quick presets.
            - **Universal Cancel Mute**: Tap to cancel any active mute period safely.
          files: build/app/outputs/flutter-apk/app-release.apk

